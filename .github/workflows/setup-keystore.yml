name: Generate signing keystore

# A FRESH KEY, ON PURPOSE. This is not the production signing key and must
# not become it. Generating one here means the Kodi POV IL release key never
# leaves the production repository, which matters because an experiment is
# exactly the kind of place where a repo gets shared more casually than
# intended. The cost is only that this app can never be updated with a
# different key -- fine, it is a new app that has never shipped.
#
# The two apps coexist on a device regardless of key: Android separates them by
# package id (org.xbmc.povi vs org.xbmc.povr), not by signature.
#
# One-time workflow that creates an Android release keystore on the
# runner, encrypts it with KEYSTORE_PASSWORD, and opens a PR that adds
# it to the repo as `release.keystore.enc`. The unencrypted keystore
# never leaves the runner; only the encrypted blob lands in git.
#
# Run order: add the KEYSTORE_PASSWORD secret first, then trigger this
# workflow once, merge the resulting PR. After that the main APK build
# workflow can decrypt and use the keystore on every run.

on:
  workflow_dispatch:
    inputs:
      validity_days:
        description: 'Keystore validity in days (10000 = ~27 years, recommended)'
        required: true
        default: '10000'
      dname:
        description: 'Certificate distinguished name'
        required: true
        default: 'CN=POV IL Lab, O=MoranTheKing, C=IL'

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Install JDK
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless openssl

      - name: Verify KEYSTORE_PASSWORD secret is set
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set. Add it in Settings → Secrets and variables → Actions before running this workflow."
            exit 1
          fi
          # Tell GitHub to mask the password if it ever shows up in logs
          echo "::add-mask::$KEYSTORE_PASSWORD"
          if [ "${#KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "::warning::KEYSTORE_PASSWORD is shorter than 12 characters. The keystore lives in the public repo encrypted with this password; a short password makes it brute-forceable. Strongly recommend re-running with a longer password."
          fi

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -genkey -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kodipovil \
            -keyalg RSA -keysize 2048 \
            -validity "${{ github.event.inputs.validity_days }}" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass  "$KEYSTORE_PASSWORD" \
            -dname "${{ github.event.inputs.dname }}"
          # Show fingerprint for the user's records (no secret material)
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kodipovil -storepass "$KEYSTORE_PASSWORD" | \
            grep -E "Owner|Issuer|Valid from|SHA1|SHA256" || true

      - name: Encrypt keystore with AES-256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/release.keystore" \
            -out "$RUNNER_TEMP/release.keystore.enc" \
            -pass env:KEYSTORE_PASSWORD
          ls -la "$RUNNER_TEMP/release.keystore.enc"

      - name: Open PR with encrypted keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Clone main fresh so we don't accidentally bring along anything
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # PUSH STRAIGHT TO main, DO NOT OPEN A PULL REQUEST.
          #
          # The first run of this workflow did everything right and then failed
          # on its last line:
          #
          #   pull request create failed: GraphQL: GitHub Actions is not
          #   permitted to create or approve pull requests
          #
          # That is a repository/org setting ("Allow GitHub Actions to create
          # and approve pull requests"), off by default, and it left a perfectly
          # good encrypted keystore stranded on a branch with the job marked
          # red -- which reads as "the key failed to generate" when the key was
          # fine. Turning the setting on to gain a review step nobody performs
          # is the wrong trade: the only thing being added is one encrypted
          # blob this same job just produced, and there is nothing in it for a
          # human to review.
          mkdir -p .secrets
          cp "$RUNNER_TEMP/release.keystore.enc" .secrets/release.keystore.enc
          # Add ONLY this path, so nothing else can ride along.
          git add .secrets/release.keystore.enc
          if ! git diff --cached --quiet -- .secrets/release.keystore.enc; then
            COMMIT_MSG=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n%s' \
              "Add encrypted release keystore" \
              "Generated by .github/workflows/setup-keystore.yml." \
              "Encrypted with AES-256-CBC + PBKDF2 (200k iterations) using the" \
              "KEYSTORE_PASSWORD secret. Unencrypted keystore never left the runner." \
              "The build workflow decrypts this at build time and uses it to" \
              "sign the APK + verify the certificate.")
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:main
            echo "Pushed .secrets/release.keystore.enc to main."
          else
            echo "::error::Keystore already present and unchanged -- refusing to overwrite. Delete .secrets/release.keystore.enc first if you really mean to replace the signing key (every installed APK would then have to be uninstalled before it could update)."
            exit 1
          fi
