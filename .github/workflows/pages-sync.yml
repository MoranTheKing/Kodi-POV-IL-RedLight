name: Pages sync (reusable)

# The actual publish. Called directly by whoever changed something, never
# triggered by an event, and that is the whole point of it being separate.
#
# WHY IT IS NOT AN EVENT-DRIVEN WORKFLOW ANY MORE. It used to be, and the very
# first real build proved that arrangement broken in two independent ways at
# once:
#
#   1. `on: release: [published]` never fired, because the release was created
#      by a job using GITHUB_TOKEN, and GitHub deliberately does not let a
#      token-driven event start another workflow. That is the anti-recursion
#      rule, and it is not a bug to work around -- it is a rule to stop
#      depending on.
#   2. The build's fallback, `gh workflow run deploy-pages.yml || true`, needs
#      `actions: write`, which the build job did not declare. It failed. The
#      `|| true` swallowed it whole.
#
# So the release was published at 11:11 and the download page went on serving a
# version of itself built at 11:03, before the APKs existed, with every job
# green. Two safety nets, both with holes, arranged so that neither reported.
#
# Calling this as a job removes the class: the publish is part of the build's
# own run, it cannot be skipped, and if it fails the build is red.

on:
  workflow_call:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Publish main to gh-pages, with the release APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --single-branch --branch=gh-pages "$REMOTE" gh
          else
            mkdir gh && cd gh && git init -q && git checkout -q -b gh-pages && cd ..
          fi
          cd gh
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cd ..
          git clone --depth=1 --single-branch --branch=main "$REMOTE" src
          cd src
          # .github cannot be pushed with GITHUB_TOKEN; .secrets must never be
          # published; and .gitignore MUST NOT COME ALONG. That last one is not
          # housekeeping -- it broke this exact workflow. The repo's .gitignore
          # carries `*.apk` so local builds never get committed here, and
          # publishing it to gh-pages meant `git add -A` there silently skipped
          # the very APKs this job had just downloaded. The job stayed green:
          # the download worked, the files were on disk, and only the `add`
          # dropped them.
          PUBLISH="$(git ls-tree --name-only HEAD | grep -vxE '\.github|\.secrets|\.gitignore')"
          # shellcheck disable=SC2086
          git archive HEAD -- $PUBLISH | tar -x -C ../gh
          cd ..
          # git archive|tar EXTRACTS; it never deletes. A file published to
          # gh-pages once stays there even after main stops publishing it --
          # which is how .gitignore, with its `*.apk` rule, survived being
          # removed from the publish set and went on quietly excluding the
          # APKs from `git add`. Remove it explicitly rather than trusting that
          # not-copying is the same as not-present.
          rm -f gh/.gitignore
          mkdir -p gh/downloads
          # TAKE THE NEWEST RELEASE THAT ACTUALLY FITS, NOT SIMPLY THE NEWEST.
          #
          # gh-pages is a git branch and git refuses any file of 100 MB or
          # more. One build published a 119 MB APK, and because this job used
          # "the latest release" unconditionally, EVERY publish afterwards
          # downloaded that APK, staged it, and had the push rejected -- so a
          # single bad release permanently broke the download page, including
          # for commits that had nothing to do with it.
          #
          # Skipping over it costs nothing and heals itself: the page keeps
          # serving the last good APK, and the moment a build within the limit
          # is released it is picked up automatically. No manual cleanup, and
          # no state to remember.
          LIMIT=$((100 * 1000 * 1000))
          PICKED=""
          for tag in $(gh release list --repo "$REPO_SLUG" --limit 20 \
                        --json tagName --jq '.[].tagName'); do
            sizes=$(gh api "repos/$REPO_SLUG/releases/tags/$tag" \
                      --jq '.assets[] | select(.name|endswith(".apk")) | .size' 2>/dev/null || true)
            [ -n "$sizes" ] || continue
            fits=1
            for s in $sizes; do [ "$s" -lt "$LIMIT" ] || fits=0; done
            if [ "$fits" = "1" ]; then PICKED="$tag"; break; fi
            echo "::warning::skipping release $tag -- an APK in it is at or over the ${LIMIT} byte limit git will accept"
          done
          if [ -n "$PICKED" ]; then
            echo "publishing APKs from release $PICKED"
            gh release download "$PICKED" --repo "$REPO_SLUG" \
              --pattern "POV-IL-Lab-64bit.apk" \
              --pattern "POV-IL-Lab-32bit.apk" \
              --dir gh/downloads --clobber
            test -s gh/downloads/POV-IL-Lab-64bit.apk
            test -s gh/downloads/POV-IL-Lab-32bit.apk
            ls -la gh/downloads/*.apk
          else
            echo "::notice::No release with APKs inside the size limit; leaving whatever the page already serves."
          fi
          # KODI BROWSES THIS SITE AS A DIRECTORY LISTING, and it reads the
          # HTML for links. A page that describes its files in prose instead of
          # linking to them shows "0 items" in Kodi's install-from-zip browser
          # -- which is what happened, from a page redesign that kept every
          # word and dropped every anchor. Two audiences, one file; only one of
          # them complains.
          for dir in wizard repo; do
            [ -d "gh/$dir" ] || continue
            for z in gh/$dir/*.zip; do
              [ -e "$z" ] || continue
              base=$(basename "$z")
              if ! grep -q "href=\"$base\"" "gh/$dir/index.html" 2>/dev/null; then
                echo "::error::$dir/index.html has no plain link to $base. Kodi lists this folder by parsing that HTML and will show it as empty."
                exit 1
              fi
            done
          done
          touch gh/.nojekyll
          cd gh
          git add -A
          # -f as well: belt and braces. Even if an ignore rule reappears here
          # some other way, the artifacts people actually download are not
          # allowed to be quietly dropped.
          if compgen -G "downloads/*.apk" > /dev/null; then
            git add -f downloads/*.apk
          fi
          if git diff --cached --quiet; then
            echo "gh-pages already matches."
          else
            git commit -q -m "Publish ${GITHUB_SHA:0:7}"
            git push "$REMOTE" gh-pages
          fi
          # PROVE IT LANDED, from the committed tree rather than from the disk.
          # Every intermediate step above reported success while the APKs were
          # missing from the commit; the only honest check is to ask the tree
          # what it actually contains. Same lesson as the patcher health report
          # in the production repo: verify the outcome, not the step.
          if [ -n "$PICKED" ]; then
            for f in POV-IL-Lab-64bit.apk POV-IL-Lab-32bit.apk; do
              if ! git cat-file -e "HEAD:downloads/$f" 2>/dev/null; then
                echo "::error::downloads/$f is NOT in the published gh-pages tree even though release $PICKED carries it. The download page would serve a 404."
                exit 1
              fi
              echo "verified in tree: downloads/$f ($(git cat-file -s "$(git rev-parse "HEAD:downloads/$f")") bytes)"
            done
          fi
