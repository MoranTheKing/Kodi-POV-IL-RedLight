name: Deploy GitHub Pages

# Republishes the site when main changes, or on demand. The APK build does NOT
# rely on this: it calls the same reusable job itself, because an event-driven
# trigger silently failed to fire the first time it mattered. See
# pages-sync.yml for the full account.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/pages-sync.yml
